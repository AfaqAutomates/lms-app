<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1c33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>LubriTrack</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="authScreen" class="auth-wrap" style="display:none">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="logo" id="authLogo"></div>
      <div><b>LubriTrack</b><span>Lubrication Management &amp; Reliability</span></div>
    </div>
    <div id="authError" class="notice" style="display:none"></div>
    <input id="authEmail" type="email" placeholder="Email">
    <input id="authPassword" type="password" placeholder="Password">
    <div class="modal-foot" style="justify-content:flex-end;margin-top:4px;">
      <button class="btn" id="btnSignIn">Sign in</button>
    </div>
    <div style="font-size:11px;color:var(--sub);margin-top:10px;">Accounts are created by an administrator. Contact yours if you don't have a login yet.</div>
  </div>
</div>

<div id="appScreen" style="display:none">
  <div id="shell">
    <div id="backdrop"></div>
    <aside id="sidebar">
      <div class="sb-brand">
        <div class="logo" id="brandLogo"></div>
        <div class="sb-brand-text"><b>LubriTrack</b><span>Lubrication Management &amp; Reliability</span></div>
      </div>
      <nav id="sbnav"></nav>
      <div class="sb-plant">Riverside Plant<br>Lubrication System</div>
    </aside>
    <div id="main">
      <header id="topbar">
        <button id="hamburger"></button>
        <div class="tb-title" id="pageTitle">Dashboard</div>
        <button class="bell"><span id="bellIcon"></span></button>
        <div class="tb-user">
          <div class="tb-avatar" id="tbAvatar">?</div>
          <div class="tb-user-text"><b id="tbName">—</b><span id="tbRole">—</span></div>
        </div>
        <button class="btn sec" id="btnChangePw" style="padding:8px 12px;">Change password</button>
        <button class="btn sec" id="btnSignOut" style="padding:8px 12px;">Sign out</button>
      </header>
      <main id="page"></main>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/icons.js"></script>
<script src="js/app.js"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
